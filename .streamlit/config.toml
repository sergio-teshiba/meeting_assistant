# Apariencia y servidor. (Los secretos van en .streamlit/secrets.toml, que NO se sube a git.)
# Concepto visual: «sala de juntas de noche». Tinta azul de fondo; ámbar = atención y
# acciones; cian = en vivo / escuchando (este último se aplica en app.py).
[theme]
base = "dark"
primaryColor = "#F2B035"
backgroundColor = "#131B2E"
secondaryBackgroundColor = "#1B2540"
textColor = "#E8ECF4"
borderColor = "#2B3757"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.55rem"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap, IBM Plex Sans, sans-serif"
headingFontWeights = [700, 650, 650, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#101727"
secondaryBackgroundColor = "#18213A"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 100
